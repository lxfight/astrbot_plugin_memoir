<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记忆管理 - Memoir</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <style>
      /* ============ design tokens ============ */
      :root {
        --bg: #f2f4f7;
        --surface: #ffffff;
        --surface-2: #f5f7f9;
        --surface-hover: #eef1f4;
        --border: #e3e7ee;
        --hairline: #edf0f4;
        --text: #182130;
        --text-dim: #5b6675;
        --text-faint: #9aa4b1;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --accent-contrast: #ffffff;
        --accent-soft: rgba(13, 148, 136, 0.1);
        --accent-border: rgba(13, 148, 136, 0.35);
        --blue: #2563eb;
        --blue-soft: rgba(37, 99, 235, 0.09);
        --amber: #b45309;
        --amber-soft: rgba(217, 119, 6, 0.11);
        --danger: #dc2626;
        --danger-soft: rgba(220, 38, 38, 0.08);
        --ok: #16a34a;
        --ok-soft: rgba(22, 163, 74, 0.09);
        --slate-soft: #f1f3f6;
        --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
        --shadow-md: 0 1px 3px rgba(16, 24, 40, 0.05), 0 10px 28px rgba(16, 24, 40, 0.07);
        --ring: 0 0 0 3px rgba(13, 148, 136, 0.16);
        --sidebar-w: 292px;
        --r: 12px;
      }
      html[data-theme="dark"] {
        --bg: #0e1116;
        --surface: #151a21;
        --surface-2: #1a2028;
        --surface-hover: #222a34;
        --border: #262e38;
        --hairline: #1f262f;
        --text: #e8ecf1;
        --text-dim: #98a2ae;
        --text-faint: #5f6b77;
        --accent: #14b8a6;
        --accent-hover: #2dd4bf;
        --accent-contrast: #04211d;
        --accent-soft: rgba(20, 184, 166, 0.14);
        --accent-border: rgba(45, 212, 191, 0.4);
        --blue: #60a5fa;
        --blue-soft: rgba(96, 165, 250, 0.13);
        --amber: #fbbf24;
        --amber-soft: rgba(251, 191, 36, 0.12);
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.12);
        --ok: #4ade80;
        --ok-soft: rgba(74, 222, 128, 0.12);
        --slate-soft: #1e2530;
        --shadow-sm: none;
        --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.35);
        --ring: 0 0 0 3px rgba(20, 184, 166, 0.22);
      }

      * { box-sizing: border-box; }
      html { height: 100%; }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: rgba(13, 148, 136, 0.22); }
      button { font: inherit; color: inherit; }
      svg.lucide { width: 15px; height: 15px; stroke-width: 1.75; flex-shrink: 0; }

      *::-webkit-scrollbar { width: 9px; height: 9px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: var(--border); border-radius: 99px; border: 2px solid transparent;
        background-clip: content-box;
      }
      *::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; }

      #fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.7; }

      /* ============ motion ============ */
      @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeSlideRight { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes fadeSlideLeft { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes popIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes bubbleIn { from { opacity: 0; transform: scale(0.96) translateY(5px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

      /* ============ app shell ============ */
      .app {
        position: relative; z-index: 1;
        display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        height: 100vh;
      }

      /* ============ sidebar ============ */
      .sidebar {
        display: flex; flex-direction: column; min-height: 0;
        background: var(--surface); border-right: 1px solid var(--border);
        animation: fadeSlideRight 0.4s cubic-bezier(0.22, 0.8, 0.36, 1) both;
      }
      .brand {
        display: flex; align-items: center; gap: 12px;
        padding: 20px 20px 16px;
      }
      svg.lucide.brand-icon {
        width: 40px; height: 40px; padding: 10px;
        border-radius: 12px; background: var(--accent); color: var(--accent-contrast);
        stroke-width: 1.6; flex-shrink: 0;
      }
      h1 { font-size: 16.5px; font-weight: 700; margin: 0; letter-spacing: 0.01em; line-height: 1.35; }
      .sub { color: var(--text-dim); font-size: 11.5px; margin: 1px 0 0; }

      .side-stats {
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        padding: 0 16px 14px;
      }
      .st {
        display: flex; align-items: center; gap: 10px;
        background: var(--surface-2); border: 1px solid var(--hairline);
        border-radius: var(--r); padding: 10px 12px;
        animation: popIn 0.45s cubic-bezier(0.22, 0.8, 0.36, 1) backwards;
        transition: border-color 0.15s, background 0.15s;
      }
      .st:hover { border-color: var(--border); background: var(--surface-hover); }
      .st .chip {
        width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
      }
      .st .chip svg { width: 14px; height: 14px; }
      .st .num { font-size: 17px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
      .st .label { font-size: 11px; color: var(--text-dim); line-height: 1.3; }
      .st.c-scope .chip { background: var(--blue-soft); color: var(--blue); }
      .st.c-memory .chip { background: var(--accent-soft); color: var(--accent); }
      .st.c-raw .chip { background: var(--slate-soft); color: var(--text-dim); }
      html[data-theme="dark"] .st.c-raw .chip { background: rgba(148, 163, 184, 0.14); color: #94a3b8; }
      .st.c-pending .chip { background: var(--amber-soft); color: var(--amber); }

      .side-search { padding: 0 16px 12px; }
      .search-wrap {
        display: flex; align-items: center; gap: 8px;
        background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 9px; padding: 0 11px; height: 34px;
        color: var(--text-faint); transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
      }
      .search-wrap:focus-within { border-color: var(--accent); box-shadow: var(--ring); background: var(--surface); }
      .search-wrap svg { width: 14px; height: 14px; transition: transform 0.2s, color 0.2s; }
      .search-wrap:focus-within svg { transform: scale(1.12); color: var(--accent); }
      .search-wrap input {
        flex: 1; min-width: 0; background: transparent; border: none; outline: none;
        color: var(--text); font-size: 13px; height: 100%;
      }
      .search-wrap input::placeholder { color: var(--text-faint); }

      .scope-list { flex: 1; overflow-y: auto; padding: 2px 10px 14px; }
      .group-title {
        padding: 12px 8px 6px; font-size: 11px; font-weight: 700;
        letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-faint);
        display: flex; align-items: center; gap: 6px;
      }
      .group-title .count {
        margin-left: auto; font-weight: 600; color: var(--text-faint);
        background: var(--surface-2); border: 1px solid var(--hairline);
        border-radius: 999px; padding: 0 7px; line-height: 17px; font-size: 10.5px;
        font-variant-numeric: tabular-nums;
      }
      .scope-item {
        position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
        padding: 8px 9px; border: 1px solid transparent; background: transparent;
        border-radius: 10px; cursor: pointer; text-align: left;
        transition: background 0.15s, border-color 0.15s;
        animation: fadeSlideRight 0.3s cubic-bezier(0.22, 0.8, 0.36, 1) backwards;
      }
      .scope-item:hover { background: var(--surface-2); }
      .scope-item:active { transform: scale(0.98); }
      .scope-item.active { background: var(--accent-soft); border-color: transparent; }
      .scope-item.active::before {
        content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px;
        border-radius: 99px; background: var(--accent);
      }
      .scope-item .chip {
        width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--surface-2); color: var(--text-dim);
        border: 1px solid var(--hairline); transition: all 0.15s;
      }
      .scope-item.active .chip { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
      .scope-item .info { flex: 1; min-width: 0; }
      .scope-item .name {
        display: flex; align-items: center;
        font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap;
      }
      .scope-item .name > span { overflow: hidden; text-overflow: ellipsis; }
      .scope-item .meta { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
      .scope-item .meta .pending { color: var(--amber); font-weight: 600; }
      .badge-dot {
        width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex-shrink: 0;
        box-shadow: 0 0 0 3px var(--amber-soft);
        animation: breathe 1.8s ease-in-out infinite;
      }
      .disabled-tag {
        font-size: 10px; color: var(--text-faint); font-weight: 500;
        border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; margin-left: 6px; line-height: 15px;
      }

      .side-foot {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 14px; border-top: 1px solid var(--hairline);
      }
      .side-foot .foot-hint { flex: 1; font-size: 11px; color: var(--text-faint); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ============ main / detail ============ */
      .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .detail-head {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 22px; border-bottom: 1px solid var(--border);
        background: var(--surface);
        animation: fadeSlideUp 0.35s cubic-bezier(0.22, 0.8, 0.36, 1) backwards;
      }
      .detail-head .chip {
        width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--accent-soft); color: var(--accent);
      }
      .detail-head .name { font-size: 15px; font-weight: 700; }
      .detail-head .sub { font-size: 11.5px; color: var(--text-faint); margin: 1px 0 0; }
      .head-stats { display: flex; gap: 6px; margin-left: auto; }
      .hstat {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11.5px; font-weight: 600; line-height: 24px;
        padding: 0 10px; border-radius: 999px;
        background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
        font-variant-numeric: tabular-nums;
      }
      .hstat svg { width: 12px; height: 12px; }
      .hstat.h-pending { color: var(--amber); border-color: transparent; background: var(--amber-soft); }
      .status-badge {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px;
        animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
      }
      .status-badge.off { color: var(--danger); background: var(--danger-soft); }
      .status-badge.custom { color: var(--blue); background: var(--blue-soft); }
      .status-badge svg { width: 12px; height: 12px; }

      .tabs {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 20px; border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .tab-group {
        display: flex; gap: 2px; padding: 3px;
        background: var(--surface-2); border: 1px solid var(--hairline);
        border-radius: 10px;
      }
      .tab {
        display: flex; align-items: center; gap: 6px;
        padding: 5px 13px; cursor: pointer; user-select: none;
        color: var(--text-dim); font-size: 12.5px; font-weight: 600;
        border: none; background: none; border-radius: 7px;
        transition: color 0.16s, background 0.16s, transform 0.16s;
      }
      .tab:hover { color: var(--text); }
      .tab:active { transform: scale(0.95); }
      .tab.active { color: var(--accent-contrast); background: var(--accent); }
      .tab svg { width: 14px; height: 14px; }
      .spacer { flex: 1; }
      .tab-search { height: 32px; max-width: 240px; flex: 0 1 240px; }

      .content { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
      .list-pad { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

      /* ============ memory cards ============ */
      .mem {
        position: relative; display: flex; align-items: stretch; gap: 12px;
        padding: 12px 14px 12px 16px; border-radius: var(--r);
        background: var(--surface); border: 1px solid var(--border);
        transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
        animation: fadeSlideUp 0.3s cubic-bezier(0.22, 0.8, 0.36, 1) backwards;
      }
      .mem:hover { border-color: var(--accent-border); box-shadow: var(--shadow-md); }
      .mem::before {
        content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
        border-radius: 99px; background: var(--spine, var(--border));
      }
      .mem.t-semantic { --spine: var(--blue); }
      .mem.t-insight { --spine: var(--accent); }
      .mem.t-episodic { --spine: var(--text-faint); }
      .mem.t-raw { --spine: var(--border); }
      .mem-body { flex: 1; min-width: 0; }
      .mem-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 5px; }
      .tag-chip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 8px; border-radius: 999px;
      }
      .tag-chip svg { width: 11px; height: 11px; }
      .badge.t-semantic { color: var(--blue); background: var(--blue-soft); }
      .badge.t-insight { color: var(--accent); background: var(--accent-soft); }
      .badge.t-episodic { color: var(--text-dim); background: var(--slate-soft); }
      html[data-theme="dark"] .badge.t-episodic { background: rgba(148, 163, 184, 0.13); }
      .badge.t-raw { color: var(--text-dim); background: transparent; border: 1px solid var(--border); }
      .subject-chip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 8px;
        border-radius: 999px; color: var(--text-dim);
        background: var(--surface-2); border: 1px solid var(--hairline);
      }
      .subject-chip svg { width: 11px; height: 11px; }
      .mem-content { font-size: 13.5px; line-height: 1.65; word-break: break-word; white-space: pre-wrap; }
      .mem-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
      .mem-tag {
        font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 999px;
        color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--hairline);
        cursor: pointer; transition: all 0.15s;
      }
      .mem-tag:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); }
      .mem-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 9px; font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
      .meter { display: inline-flex; align-items: center; gap: 5px; }
      .meter .dots { display: inline-flex; gap: 3px; }
      .meter .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
      .meter .dots i.on { background: var(--amber); }
      .strength-bar { display: inline-flex; align-items: center; gap: 6px; }
      .strength-bar .bar { width: 56px; height: 4px; border-radius: 99px; overflow: hidden; background: var(--surface-hover); }
      .strength-bar .bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.6s cubic-bezier(0.22, 0.8, 0.36, 1); }
      .mem .del {
        flex-shrink: 0; align-self: center;
        border: none; background: transparent; cursor: pointer;
        width: 30px; height: 30px; border-radius: 8px;
        display: inline-flex; align-items: center; justify-content: center;
        color: var(--text-faint); opacity: 0;
        transition: opacity 0.16s, color 0.16s, background 0.16s, transform 0.16s;
      }
      .mem:hover .del { opacity: 1; }
      .mem .del:hover { color: var(--danger); background: var(--danger-soft); transform: scale(1.08); }

      /* ============ chat (raw turns) ============ */
      .chat { padding: 16px 20px 10px; display: flex; flex-direction: column; }
      .day-chip {
        align-self: center; margin: 10px 0 14px; padding: 2px 13px;
        border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--text-dim);
        background: var(--surface); border: 1px solid var(--border);
        animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
      }
      .msg {
        display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px;
        max-width: 82%;
        animation: fadeSlideRight 0.32s cubic-bezier(0.22, 0.8, 0.36, 1) backwards;
      }
      .msg.me { align-self: flex-end; flex-direction: row-reverse; animation-name: fadeSlideLeft; }
      .msg .avatar {
        width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 700; color: #fff; user-select: none;
      }
      .msg.me .avatar { background: var(--accent); color: var(--accent-contrast); }
      .msg.bot .avatar { background: var(--text-dim); }
      .msg.bot .avatar svg, .msg.me .avatar svg { width: 15px; height: 15px; }
      .msg-main { min-width: 0; display: flex; flex-direction: column; }
      .msg.me .msg-main { align-items: flex-end; }
      .msg-head {
        display: flex; align-items: center; gap: 7px; margin: 0 4px 3px;
        font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums;
      }
      .msg-head .speaker { font-weight: 700; }
      .msg-head .del {
        border: none; background: transparent; padding: 2px; cursor: pointer;
        color: var(--text-faint); border-radius: 5px; opacity: 0;
        transition: opacity 0.15s, color 0.15s, transform 0.15s;
        display: inline-flex;
      }
      .msg-head .del:hover { color: var(--danger); transform: scale(1.15); }
      .msg:hover .msg-head .del { opacity: 1; }
      .bubble {
        position: relative; padding: 9px 13px; border-radius: 14px;
        font-size: 13.5px; line-height: 1.6; word-break: break-word; white-space: pre-wrap;
        transition: transform 0.16s, box-shadow 0.16s;
        animation: bubbleIn 0.28s cubic-bezier(0.22, 0.8, 0.36, 1) backwards;
      }
      .msg.bot .bubble, .msg.other .bubble {
        background: var(--surface); border: 1px solid var(--border);
        border-top-left-radius: 4px; box-shadow: var(--shadow-sm);
      }
      .msg.me .bubble {
        background: var(--accent); color: var(--accent-contrast);
        border-top-right-radius: 4px;
      }
      .msg:hover .bubble { transform: translateY(-1px); box-shadow: var(--shadow-md); }
      .bubble .pending-pill {
        display: inline-flex; align-items: center; gap: 4px;
        margin-left: 8px; padding: 0 7px; border-radius: 999px;
        font-size: 10.5px; line-height: 16px; vertical-align: 1px;
        color: var(--amber); background: var(--amber-soft);
      }
      .bubble .pending-pill::before {
        content: ""; width: 5px; height: 5px; border-radius: 50%;
        background: var(--amber); animation: breathe 1.8s ease-in-out infinite;
      }
      .bubble code, .bubble .placeholder-chip {
        background: rgba(0, 0, 0, 0.06); padding: 1px 5px; border-radius: 4px; font-size: 12px;
      }
      html[data-theme="dark"] .bubble code, html[data-theme="dark"] .bubble .placeholder-chip {
        background: rgba(255, 255, 255, 0.09);
      }
      .msg.me .bubble code, .msg.me .bubble .placeholder-chip { background: rgba(255, 255, 255, 0.2); }

      /* ============ buttons ============ */
      .btn {
        display: inline-flex; align-items: center; gap: 6px;
        height: 32px; padding: 0 13px; border-radius: 9px;
        border: 1px solid var(--border); background: var(--surface);
        color: var(--text-dim); font-size: 12.5px; font-weight: 600; cursor: pointer;
        transition: all 0.16s;
      }
      .btn:hover { color: var(--text); border-color: var(--text-faint); box-shadow: var(--shadow-sm); }
      .btn:active { transform: scale(0.96); }
      .btn.danger { color: var(--danger); border-color: transparent; background: var(--danger-soft); }
      .btn.danger:hover { border-color: var(--danger); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
      .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-contrast); }
      .btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }

      .icon-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 32px; height: 32px; border-radius: 9px;
        border: 1px solid var(--border); background: var(--surface);
        color: var(--text-dim); cursor: pointer; transition: all 0.16s;
      }
      .icon-btn:hover { color: var(--text); border-color: var(--text-faint); }
      .icon-btn:active { transform: scale(0.92); }
      .icon-btn:disabled { opacity: 0.4; cursor: default; }
      .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }

      /* ============ forms ============ */
      .form-card {
        margin: 14px 18px; padding: 16px 18px; border-radius: var(--r);
        background: var(--surface); border: 1px solid var(--border);
        animation: fadeSlideUp 0.32s cubic-bezier(0.22, 0.8, 0.36, 1) backwards;
      }
      .form-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; margin-bottom: 2px; }
      .form-title svg { width: 15px; height: 15px; color: var(--accent); }
      .form-sub { font-size: 12px; color: var(--text-faint); margin: 0 0 12px; }
      .form-sub code {
        background: var(--surface-2); border: 1px solid var(--hairline);
        padding: 1px 6px; border-radius: 5px; font-size: 11px;
      }
      .form-section-sub {
        font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
        color: var(--text-faint); text-transform: uppercase; margin: 14px 0 2px;
      }
      .form-section-sub:first-child { margin-top: 0; }
      .field {
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; padding: 9px 10px; margin: 0 -10px; border-radius: 9px;
        border-bottom: 1px dashed var(--hairline);
        transition: background 0.15s;
      }
      .field:hover { background: var(--surface-2); }
      .field:last-child { border-bottom: none; }
      .field .f-label { font-size: 13px; font-weight: 500; }
      .field .f-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }
      .field .f-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
      input[type="text"], input[type="number"], select.f-input {
        background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 8px; color: var(--text); font-size: 12.5px; padding: 6px 10px;
        outline: none; width: 150px; transition: border-color 0.16s, box-shadow 0.16s;
      }
      input:focus, select.f-input:focus { border-color: var(--accent); box-shadow: var(--ring); background: var(--surface); }
      input::placeholder { color: var(--text-faint); }
      .switch { position: relative; display: inline-block; width: 36px; height: 20px; cursor: pointer; vertical-align: middle; }
      .switch input { display: none; }
      .slider { position: absolute; inset: 0; border-radius: 99px; background: var(--border); transition: 0.18s; }
      .slider::before {
        content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
        background: #fff; top: 2px; left: 2px;
        transition: 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .switch input:checked + .slider { background: var(--accent); }
      .switch input:checked + .slider::before { transform: translateX(16px); }
      .switch:active .slider::before { width: 18px; }
      .form-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 4px 0 0; }

      /* ============ consent list ============ */
      .consent-row {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 10px; margin: 0 -10px; border-radius: 9px;
        border-bottom: 1px dashed var(--hairline); transition: background 0.15s;
      }
      .consent-row:hover { background: var(--surface-2); }
      .consent-row:last-child { border-bottom: none; }
      .consent-row .who { flex: 1; min-width: 0; }
      .consent-row .pid { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
      .consent-row .plat { font-size: 11px; color: var(--text-faint); }
      .consent-row .time { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
      .consent-state {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; font-weight: 700; padding: 1px 9px; border-radius: 999px;
      }
      .consent-state.on { color: var(--ok); background: var(--ok-soft); }
      .consent-state.off { color: var(--text-faint); background: var(--surface-2); }

      /* ============ empty / skeleton / error ============ */
      .empty {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 48px 24px; text-align: center; color: var(--text-faint);
        animation: fadeSlideUp 0.35s cubic-bezier(0.22, 0.8, 0.36, 1);
      }
      .empty-icon {
        width: 56px; height: 56px; border-radius: 18px;
        display: flex; align-items: center; justify-content: center;
        background: var(--accent-soft); color: var(--accent); margin-bottom: 14px;
      }
      .empty-icon svg { width: 25px; height: 25px; stroke-width: 1.5; }
      .empty h3 { margin: 0 0 5px; font-size: 14.5px; font-weight: 700; color: var(--text); }
      .empty p { margin: 0 0 18px; font-size: 12.5px; }
      .empty-steps { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .empty-steps .step {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 13px; border-radius: 999px;
        background: var(--surface); border: 1px solid var(--border);
        font-size: 12px; font-weight: 500; color: var(--text-dim);
        transition: all 0.16s;
      }
      .empty-steps .step:hover { border-color: var(--accent-border); color: var(--text); }
      .empty-steps .step svg { width: 13px; height: 13px; color: var(--accent); }
      .empty-steps > svg { width: 14px; height: 14px; color: var(--text-faint); }

      .error-panel {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 44px 24px; text-align: center;
        animation: fadeSlideUp 0.3s cubic-bezier(0.22, 0.8, 0.36, 1);
      }
      .error-panel .empty-icon { background: var(--danger-soft); color: var(--danger); }
      .error-panel h3 { margin: 0 0 4px; font-size: 14px; font-weight: 700; color: var(--text); }
      .error-panel .err-msg {
        margin: 0 0 16px; font-size: 12.5px; color: var(--text-faint);
        max-width: 420px; word-break: break-all;
      }

      .skeleton { padding: 14px 16px; }
      .skeleton .item-row {
        height: 54px; border-radius: var(--r); margin-bottom: 8px;
        background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-hover) 50%, var(--surface-2) 75%);
        background-size: 200% 100%; animation: shimmer 1.4s infinite;
      }

      /* ============ pager / toast ============ */
      .pager {
        display: flex; gap: 12px; align-items: center; justify-content: center;
        padding: 10px; border-top: 1px solid var(--border); background: var(--surface);
        font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums;
      }
      .toast {
        position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(14px) scale(0.95);
        background: #1b2330; color: #f2f5f9;
        padding: 8px 17px; border-radius: 10px; font-size: 12.5px; font-weight: 500;
        opacity: 0; transition: 0.24s cubic-bezier(0.34, 1.3, 0.64, 1); pointer-events: none; z-index: 50;
        box-shadow: 0 10px 32px rgba(8, 12, 20, 0.35);
        display: flex; align-items: center; gap: 7px;
      }
      html[data-theme="dark"] .toast { background: #232c3a; border: 1px solid var(--border); }
      .toast svg { width: 14px; height: 14px; }
      .toast.ok svg { color: #4ade80; }
      .toast.err { background: #b3261e; color: #fff; }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

      @media (max-width: 860px) {
        :root { --sidebar-w: 240px; }
      }
      @media (max-width: 700px) {
        body { overflow: auto; height: auto; min-height: 100vh; }
        .app { grid-template-columns: 1fr; height: auto; }
        .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
        .scope-list { max-height: 210px; }
        .content { overflow: visible; }
        .main { min-height: 72vh; }
        .msg { max-width: 92%; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <canvas id="fx"></canvas>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <i data-lucide="brain-circuit" class="brand-icon"></i>
          <div>
            <h1>记忆管理</h1>
            <p class="sub">捕获 → 巩固 → 遗忘 → 召回</p>
          </div>
        </div>

        <div class="side-stats" id="cards"></div>

        <div class="side-search">
          <div class="search-wrap">
            <i data-lucide="search"></i>
            <input type="text" id="scope-filter" placeholder="搜索会话" />
          </div>
        </div>

        <div class="scope-list" id="scope-list"></div>

        <div class="side-foot">
          <span class="foot-hint">每个会话可独立调整策略</span>
          <button class="icon-btn" id="refresh" title="刷新"><i data-lucide="refresh-cw"></i></button>
        </div>
      </aside>

      <main class="main">
        <div class="detail-head" id="detail-head"></div>
        <div class="tabs" id="tabs">
          <div class="tab-group">
            <button class="tab active" data-tab="memories"><i data-lucide="brain"></i>记忆</button>
            <button class="tab" data-tab="raw"><i data-lucide="messages-square"></i>原文对话</button>
            <button class="tab" data-tab="settings"><i data-lucide="settings-2"></i>会话配置</button>
          </div>
          <div class="spacer"></div>
          <div class="search-wrap tab-search" id="search-wrap">
            <i data-lucide="search"></i>
            <input type="text" id="search" placeholder="搜索当前会话记忆" />
          </div>
        </div>
        <div class="content" id="content"></div>
        <div class="pager" id="pager" style="display: none">
          <button class="icon-btn" id="prev"><i data-lucide="chevron-left"></i></button>
          <span id="page-info"></span>
          <button class="icon-btn" id="next"><i data-lucide="chevron-right"></i></button>
        </div>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
      const bridge = window.AstrBotPluginPage;
      const $ = (id) => document.getElementById(id);

      const TYPE_NAMES = { semantic: "认知", insight: "洞察", raw: "对话", episodic: "往事" };
      const TYPE_ICONS = { semantic: "lightbulb", insight: "sparkles", episodic: "history", raw: "message-circle" };
      const state = {
        scopes: [],
        scope: null,
        tab: "memories",
        page: 1,
        pageSize: 20,
        q: "",
        scopeFilter: "",
        globalConfig: {},
        providers: [],
        scopeOverride: {},
      };

      /* ---------- utils ---------- */
      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);

      const refreshIcons = () => window.lucide && window.lucide.createIcons();

      const REDUCED_MOTION = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches ?? false;

      let toastTimer = null;
      function toast(msg, kind = "ok") {
        const el = $("toast");
        el.className = `toast show ${kind}`;
        el.innerHTML = `<i data-lucide="${kind === "err" ? "circle-alert" : "circle-check"}"></i>${esc(msg)}`;
        refreshIcons();
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), kind === "err" ? 3600 : 2200);
      }

      /* ---------- error handling ---------- */
      // Unified API error wrapper: toast + console on failure, returns null so caller renders error panel
      async function safe(label, fn, { silent = false } = {}) {
        try {
          return await fn();
        } catch (err) {
          const msg = err?.message || String(err);
          console.error(`[Memoir] ${label}:`, err);
          if (!silent) toast(`${label}失败：${msg}`, "err");
          return null;
        }
      }

      const errorPanel = (label, msg, retryKey) => `
        <div class="error-panel">
          <div class="empty-icon"><i data-lucide="triangle-alert"></i></div>
          <h3>${esc(label)}失败</h3>
          <p class="err-msg">${esc(msg)}</p>
          <button class="btn" data-retry="${esc(retryKey)}"><i data-lucide="rotate-cw"></i>重试</button>
        </div>`;

      const RETRY_LOADERS = {};
      window.addEventListener("unhandledrejection", (e) => {
        console.error("[Memoir] unhandled:", e.reason);
        toast(`出错了：${e.reason?.message || e.reason}`, "err");
      });
      window.addEventListener("error", (e) => {
        console.error("[Memoir] runtime error:", e.error || e.message);
      });

      function fmtTime(ts) {
        if (!ts) return "-";
        const d = new Date(ts * 1000);
        const p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      function timeAgo(ts) {
        if (!ts) return "-";
        const s = Math.floor(Date.now() / 1000 - ts);
        if (s < 60) return "刚刚";
        if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
        if (s < 86400) return `${Math.floor(s / 3600)} 小时前`;
        if (s < 86400 * 30) return `${Math.floor(s / 86400)} 天前`;
        return fmtTime(ts).slice(0, 10);
      }

      function dayLabel(ts) {
        const d = new Date(ts * 1000);
        const now = new Date();
        const sameYear = d.getFullYear() === now.getFullYear();
        const m = d.getMonth() + 1;
        if (d.toDateString() === now.toDateString()) return "今天";
        const yest = new Date(now);
        yest.setDate(now.getDate() - 1);
        if (d.toDateString() === yest.toDateString()) return "昨天";
        return sameYear ? `${m}月${d.getDate()}日` : `${d.getFullYear()}年${m}月${d.getDate()}日`;
      }

      const emptyState = (icon, msg, withTitle) =>
        `<div class="empty"><div class="empty-icon"><i data-lucide="${icon}"></i></div>${withTitle ? `<h3>${withTitle}</h3>` : ""}<p>${msg}</p></div>`;

      const skeleton = (n = 5) =>
        `<div class="skeleton">${Array.from({ length: n }, () => '<div class="item-row"></div>').join("")}</div>`;

      const stagger = (i, base = 0, step = 30, cap = 300) =>
        REDUCED_MOTION ? "" : ` style="animation-delay:${Math.min(base + i * step, cap)}ms"`;

      /* ---------- constellation particles ---------- */
      function initParticles() {
        const cv = $("fx");
        if (REDUCED_MOTION) {
          cv.remove();
          return;
        }
        const ctx = cv.getContext("2d");
        let W = 0, H = 0, dpr = 1, raf = 0, running = false;
        const N = 36;
        const P = [];
        const mouse = { x: -9999, y: -9999 };
        let palette = [];
        const readPalette = () => {
          const dark = document.documentElement.dataset.theme === "dark";
          palette = dark
            ? ["45,212,191", "96,165,250", "100,116,139"]
            : ["13,148,136", "37,99,235", "100,116,139"];
        };

        function resize() {
          dpr = window.devicePixelRatio || 1;
          W = cv.width = Math.floor(innerWidth * dpr);
          H = cv.height = Math.floor(innerHeight * dpr);
          cv.style.width = innerWidth + "px";
          cv.style.height = innerHeight + "px";
        }

        function spawn(p) {
          p.x = Math.random() * W;
          p.y = Math.random() * H;
          p.r = (0.8 + Math.random() * 1.4) * dpr;
          p.vx = (Math.random() - 0.5) * 0.1 * dpr;
          p.vy = (-0.04 - Math.random() * 0.12) * dpr;
          p.phase = Math.random() * Math.PI * 2;
          p.tw = 0.4 + Math.random() * 0.8;
          p.c = palette[Math.floor(Math.random() * palette.length)];
        }

        function frame(t) {
          if (!running) return;
          ctx.clearRect(0, 0, W, H);
          const link = 100 * dpr;
          for (const p of P) {
            p.x += p.vx + Math.sin(t / 4000 + p.phase) * 0.04 * dpr;
            p.y += p.vy;
            const dx = p.x - mouse.x * dpr, dy = p.y - mouse.y * dpr;
            const d2 = dx * dx + dy * dy;
            const rr = 80 * dpr;
            if (d2 < rr * rr && d2 > 1) {
              const d = Math.sqrt(d2);
              const f = ((rr - d) / rr) * 0.3 * dpr;
              p.x += (dx / d) * f;
              p.y += (dy / d) * f;
            }
            if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
            if (p.x < -10) p.x = W + 10;
            if (p.x > W + 10) p.x = -10;
          }
          ctx.lineWidth = dpr * 0.6;
          for (let i = 0; i < N; i++) {
            for (let j = i + 1; j < N; j++) {
              const a = P[i], b = P[j];
              const dx = a.x - b.x, dy = a.y - b.y;
              const d = Math.hypot(dx, dy);
              if (d < link) {
                const alpha = (1 - d / link) * 0.07;
                ctx.strokeStyle = `rgba(${a.c},${alpha})`;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }
          }
          for (const p of P) {
            const tw = 0.28 + 0.26 * Math.sin(t / 900 * p.tw + p.phase);
            ctx.fillStyle = `rgba(${p.c},${tw})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          raf = requestAnimationFrame(frame);
        }

        const start = () => {
          if (running || REDUCED_MOTION) return;
          running = true;
          raf = requestAnimationFrame(frame);
        };
        const stop = () => {
          running = false;
          cancelAnimationFrame(raf);
        };

        readPalette();
        resize();
        for (let i = 0; i < N; i++) {
          const p = {};
          spawn(p);
          P.push(p);
        }
        window.addEventListener("resize", resize);
        window.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener("pointerleave", () => { mouse.x = -9999; mouse.y = -9999; });
        document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
        window.__fxRecolor = () => {
          readPalette();
          for (const p of P) p.c = palette[Math.floor(Math.random() * palette.length)];
        };
        start();
      }

      /* ---------- stats & sidebar ---------- */
      function countUp(el, target, dur = 550) {
        if (REDUCED_MOTION || target === 0) {
          el.textContent = target;
          return;
        }
        const start = performance.now();
        const tick = (t) => {
          const k = Math.min(1, (t - start) / dur);
          const eased = 1 - Math.pow(1 - k, 3);
          el.textContent = Math.round(target * eased);
          if (k < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      function renderOverview(totals) {
        const items = [
          ["c-scope", "layers", "会话", totals.scopes],
          ["c-memory", "brain", "结构化记忆", totals.memories],
          ["c-raw", "messages-square", "原文轮次", totals.raw_turns],
          ["c-pending", "clock-3", "待巩固", totals.pending],
        ];
        $("cards").innerHTML = items
          .map(
            ([cls, icon, label, num], i) =>
              `<div class="st ${cls}"${stagger(i, 0, 50)}><span class="chip"><i data-lucide="${icon}"></i></span><div><div class="num" data-count="${num}">0</div><div class="label">${label}</div></div></div>`,
          )
          .join("");
        $("cards").querySelectorAll(".num").forEach((el) => countUp(el, Number(el.dataset.count) || 0));
        refreshIcons();
      }

      function scopeName(s) {
        return `${s.scope_type === "private" ? "私聊" : "群聊"} · ${s.scope_key.split(":").slice(1).join(":")}`;
      }

      function renderSidebar() {
        const kw = state.scopeFilter.trim().toLowerCase();
        const filtered = state.scopes.filter(
          (s) => !kw || s.scope_key.toLowerCase().includes(kw) || s.scope_type.includes(kw),
        );
        if (!filtered.length) {
          $("scope-list").innerHTML = emptyState(
            state.scopes.length ? "search-x" : "inbox",
            state.scopes.length ? "没有匹配的会话" : "与机器人对话后，会话会出现在这里",
          );
          refreshIcons();
          return;
        }
        const groups = [
          ["private", "user-round", "私聊"],
          ["group", "users-round", "群聊"],
        ];
        let html = "";
        let i = 0;
        for (const [type, icon, label] of groups) {
          const list = filtered.filter((s) => s.scope_type === type);
          if (!list.length) continue;
          html += `<div class="group-title"><i data-lucide="${icon}"></i>${label}<span class="count">${list.length}</span></div>`;
          for (const s of list) {
            const active = state.scope && state.scope.scope_key === s.scope_key;
            html += `
              <button class="scope-item ${active ? "active" : ""}" data-scope="${esc(s.scope_type)}|${esc(s.scope_key)}"${stagger(i, 40)}>
                <span class="chip"><i data-lucide="${icon}"></i></span>
                <span class="info">
                  <span class="name"><span>${esc(scopeName(s))}</span>${s.memory_count === 0 ? '<span class="disabled-tag">空</span>' : ""}</span>
                  <span class="meta">${s.memory_count} 记忆 · ${timeAgo(s.last_activity_at)}${s.pending_count ? ` · <span class="pending">${s.pending_count} 待巩固</span>` : ""}</span>
                </span>
                ${s.pending_count ? '<span class="badge-dot"></span>' : ""}
              </button>`;
            i++;
          }
        }
        $("scope-list").innerHTML = html;
        refreshIcons();
      }

      /* ---------- detail ---------- */
      function renderDetailHead() {
        const s = state.scopes.find(
          (x) => state.scope && x.scope_key === state.scope.scope_key,
        );
        const hasOverride = Object.keys(state.scopeOverride).length > 0;
        const disabled = state.scopeOverride.enabled === false;
        $("detail-head").innerHTML = `
          <span class="chip"><i data-lucide="${s?.scope_type === "group" ? "users-round" : "user-round"}"></i></span>
          <div style="min-width:0">
            <div class="name">${esc(state.scope ? scopeName(state.scope) : "")}</div>
            <div class="sub">${esc(state.scope?.scope_key || "")}</div>
          </div>
          ${
            s
              ? `<div class="head-stats">
                  <span class="hstat"><i data-lucide="brain"></i>${s.memory_count} 记忆</span>
                  <span class="hstat"><i data-lucide="messages-square"></i>${s.raw_count} 原文</span>
                  ${s.pending_count ? `<span class="hstat h-pending"><i data-lucide="clock-3"></i>${s.pending_count} 待巩固</span>` : ""}
                </div>`
              : '<div style="flex:1"></div>'
          }
          ${disabled ? '<span class="status-badge off"><i data-lucide="circle-pause"></i>已禁用</span>' : ""}
          ${hasOverride && !disabled ? '<span class="status-badge custom"><i data-lucide="sliders-horizontal"></i>自定义</span>' : ""}
          <button class="btn danger" id="clear-scope"><i data-lucide="eraser"></i>清空会话</button>`;
        refreshIcons();
        $("clear-scope")?.addEventListener("click", clearScope);
      }

      function parseTags(m) {
        const raw = String(m.tags || "").trim();
        if (!raw) return [];
        return raw
          .split(/[,，]/)
          .map((t) => t.trim())
          .filter(Boolean)
          .slice(0, 6);
      }

      function importanceMeter(v) {
        const n = Math.max(0, Math.min(5, Number(v) || 0));
        return `<span class="meter"><span class="dots">${Array.from({ length: 5 }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span></span>`;
      }

      function memoryItem(m, i) {
        const type = TYPE_NAMES[m.memory_type] || m.memory_type;
        const icon = TYPE_ICONS[m.memory_type] || "message-circle";
        const tags = parseTags(m);
        const strength = Math.max(0, Math.min(1, Number(m.strength) || 0));
        return `<div class="mem t-${esc(m.memory_type)}"${stagger(i)}>
          <div class="mem-body">
            <div class="mem-top">
              <span class="tag-chip badge t-${esc(m.memory_type)}"><i data-lucide="${icon}"></i>${esc(type)}</span>
              ${m.subject ? `<span class="subject-chip"><i data-lucide="user-round"></i>${esc(m.subject)}</span>` : ""}
            </div>
            <div class="mem-content">${esc(m.content)}</div>
            ${tags.length ? `<div class="mem-tags">${tags.map((t) => `<span class="mem-tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join("")}</div>` : ""}
            <div class="mem-foot">
              <span class="strength-bar"><span class="bar"><i style="width:${Math.round(strength * 100)}%"></i></span>强度 ${(strength).toFixed(2)}</span>
              ${importanceMeter(m.importance)}<span>重要度 ${m.importance ?? "-"}</span>
              <span>${fmtTime(m.updated_at)}</span>
              <span>#${m.id}</span>
            </div>
          </div>
          <button class="del" data-del-memory="${m.id}" title="删除"><i data-lucide="trash-2"></i></button>
        </div>`;
      }

      /* ---------- raw turns: chat bubbles ---------- */
      // Parse one raw turn into bubbles: private format "用户: … / 助手: …", bridged copy "用户: …"
      function parseTurn(content) {
        const s = String(content);
        let m = s.match(/^用户[:：]\s*([\s\S]*?)\s*\/\s*助手[:：]\s*([\s\S]+)$/);
        if (m) {
          return [
            { who: "me", text: m[1] },
            { who: "bot", text: m[2] },
          ];
        }
        const u = s.match(/^用户[:：]\s*([\s\S]+)$/);
        if (u) return [{ who: "me", text: u[1] }];
        return [{ who: "other", text: s }];
      }

      function speakerHue(name) {
        let h = 0;
        for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) % 360;
        return h;
      }

      function bubbleText(text) {
        // Highlight placeholders like [图片] [语音x2], escape the rest
        return esc(text).replace(
          /\[(图片|语音|文件|视频|表情)(?:x(\d+))?\]/g,
          (_, kind, n) => `<span class="placeholder-chip">[${kind}${n ? `x${n}` : ""}]</span>`,
        );
      }

      function rawTurnHtml(r, prevDay, i) {
        const day = new Date((r.created_at || 0) * 1000).toDateString();
        const chip = day !== prevDay ? `<div class="day-chip"${stagger(i, 20)}>${esc(dayLabel(r.created_at || 0))}</div>` : "";
        const pending = r.extracted
          ? ""
          : `<span class="pending-pill">待巩固</span>`;
        const speaker = r.speaker_name
          ? `<span class="speaker" style="color:hsl(${speakerHue(r.speaker_name)} 45% 42%)">${esc(r.speaker_name)}</span> ·`
          : "";
        const head = `<div class="msg-head">${speaker}<span>${fmtTime(r.created_at)}</span><span>#${r.id}</span>${pending}<button class="del" data-del-raw="${r.id}" title="删除这轮"><i data-lucide="trash-2"></i></button></div>`;
        const parts = parseTurn(r.content);
        const rows = parts
          .map((p, k) => {
            let avatar;
            if (p.who === "bot") {
              avatar = `<span class="avatar"><i data-lucide="bot"></i></span>`;
            } else if (p.who === "me") {
              avatar = `<span class="avatar"><i data-lucide="user-round"></i></span>`;
            } else {
              const name = r.speaker_name || "?";
              avatar = `<span class="avatar" style="background:hsl(${speakerHue(name)} 42% 48%)">${esc(name.slice(0, 1))}</span>`;
            }
            // One row per role; meta info (time/delete) only attached to first message
            return `<div class="msg ${p.who}"${stagger(i, 20, 30, 260)}>${avatar}<div class="msg-main">${k === 0 ? head : ""}<div class="bubble">${bubbleText(p.text)}</div></div></div>`;
          })
          .join("");
        return { chip, html: rows, day };
      }

      function renderRawTurns(items) {
        let html = "";
        let prevDay = "";
        let i = 0;
        for (const r of items) {
          const { chip, html: msgHtml, day } = rawTurnHtml(r, prevDay, i);
          html += chip + msgHtml;
          prevDay = day;
          i++;
        }
        return `<div class="chat">${html}</div>`;
      }

      function renderPager(total, pageSize) {
        const pages = Math.max(1, Math.ceil(total / pageSize));
        if (pages <= 1) {
          $("pager").style.display = "none";
          return;
        }
        $("pager").style.display = "flex";
        $("page-info").textContent = `${state.page} / ${pages} · 共 ${total} 条`;
        $("prev").disabled = state.page <= 1;
        $("next").disabled = state.page >= pages;
      }

      async function loadMemories() {
        $("content").innerHTML = skeleton();
        const params = { scope_type: state.scope.scope_type, scope_key: state.scope.scope_key };
        const res = await safe(
          "加载记忆",
          () =>
            state.q
              ? bridge.apiGet("memories", { ...params, q: state.q })
              : bridge.apiGet("memories", { ...params, page: state.page, page_size: state.pageSize }),
          { silent: true },
        );
        if (!res) {
          $("content").innerHTML = errorPanel("加载记忆", "请求失败，请检查后端状态后重试", "memories");
          refreshIcons();
          return;
        }
        let html;
        if (state.q) {
          html = res.items.length
            ? `<div class="list-pad">${res.items.map(memoryItem).join("")}</div>`
            : emptyState("search-x", `没有找到与「${esc(state.q)}」相关的记忆`);
          renderPager(0, state.pageSize);
        } else {
          html = res.items.length
            ? `<div class="list-pad">${res.items.map(memoryItem).join("")}</div>`
            : emptyState("inbox", "当前会话还没有结构化记忆");
          renderPager(res.total, res.page_size || state.pageSize);
        }
        $("content").innerHTML = html;
        refreshIcons();
      }

      async function loadRaw() {
        $("content").innerHTML = skeleton();
        const res = await safe(
          "加载原文",
          () =>
            bridge.apiGet("raw", {
              scope_type: state.scope.scope_type,
              scope_key: state.scope.scope_key,

        if (!res) {
          $("content").innerHTML = errorPanel("加载原文对话", "请求失败，请检查后端状态后重试", "raw");
          refreshIcons();
          return;
        }
        $("content").innerHTML = res.items.length
          ? renderRawTurns(res.items)
          : emptyState("messages-square", "当前会话还没有原文对话");

        refreshIcons();
      }

      const SCOPE_FIELDS = [
        { key: "enabled", label: "启用本会话记忆", type: "inherit-switch", hint: "关闭后该会话不再捕获与召回" },
        { key: "recall_top_k", label: "线索召回条数", type: "inherit-number" },
        { key: "recall_core_top_k", label: "常驻记忆条数", type: "inherit-number" },
        { key: "recall_recent_turns", label: "群聊近因条数", type: "inherit-number", groupOnly: true },
        { key: "consolidation_count_threshold", label: "巩固触发阈值", type: "inherit-number", hint: "积攒多少轮原文后触发一次抽取" },
        { key: "consolidation_idle_hours", label: "静默触发（小时）", type: "inherit-number" },
        { key: "bridge_enabled", label: "允许自我陈述桥接", type: "inherit-switch", groupOnly: true, hint: "叠加在用户授权之上" },
        { key: "bridge_max_sensitivity", label: "敏感度上限", type: "inherit-select", options: ["low", "medium", "high"], groupOnly: true },
      ];

      function fieldRow(f, value, inheritValue, inheritable) {
        const hint = f.hint ? `<div class="f-hint">${esc(f.hint)}</div>` : "";
        let control = "";
        if (!inheritable) {
          if (f.type === "switch") {
            control = `<label class="switch"><input type="checkbox" data-cfg="${f.key}" ${value ? "checked" : ""} /><span class="slider"></span></label>`;
          } else if (f.type === "select") {
            const opts = (f.type === "provider" ? state.providers : f.options) || [];
            control = `<select class="f-input" data-cfg="${f.key}">${
              f.type === "provider" ? `<option value="">（使用当前对话模型）</option>` : ""
            }${opts.map((o) => `<option value="${esc(o)}" ${value === o ? "selected" : ""}>${esc(f.type === "provider" ? o : { low: "low 仅日常事实", medium: "medium 含一般隐私", high: "high 不限制" }[o] || o)}</option>`).join("")}</select>`;
          } else {
            control = `<input type="number" class="f-input" data-cfg="${f.key}" value="${value ?? ""}" step="${f.type === "float" ? "0.01" : "1"}" min="${f.min ?? 0}" max="${f.max ?? 100000}" />`;
          }
        } else {
          // Inherit-style control: empty value = follow global
          if (f.type === "inherit-switch") {
            const opts = [
              ["", "跟随全局"],
              ["true", "开启"],
              ["false", "关闭"],
            ];
            const cur = value === undefined || value === null ? "" : String(value);
            control = `<select class="f-input" data-cfg="${f.key}">${opts.map(([v, t]) => `<option value="${v}" ${cur === v ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
          } else if (f.type === "inherit-select") {
            const opts = ["", ...f.options];
            control = `<select class="f-input" data-cfg="${f.key}">${opts.map((o) => `<option value="${o}" ${value === o || (value === undefined && o === "") ? "selected" : ""}>${o === "" ? `跟随全局（当前：${esc(inheritValue)}）` : esc(o)}</option>`).join("")}</select>`;
          } else {
            control = `<input type="number" class="f-input" data-cfg="${f.key}" value="${value ?? ""}" placeholder="${inheritValue ?? "继承全局"}" />`;
          }
        }
        return `<div class="field"><div style="flex:1;min-width:0"><div class="f-label">${esc(f.label)}</div>${hint}</div>${control}</div>`;
      }

      async function loadScopeConfigTab() {
        $("content").innerHTML = skeleton(3);
        const [cfgRes, gRes] = await Promise.all([
          safe(
            "加载会话配置",
            () =>
              bridge.apiGet("scope-config", {
                scope_type: state.scope.scope_type,
                scope_key: state.scope.scope_key,
              }),
            { silent: true },
          ),
          safe("加载全局配置", () => bridge.apiGet("config"), { silent: true }),
        ]);
        if (!cfgRes || !gRes) {
          $("content").innerHTML = errorPanel("加载配置", "请求失败，请检查后端状态后重试", "settings");
          refreshIcons();
          return;
        }
        state.scopeOverride = cfgRes.override || {};
        state.globalConfig = gRes.config || {};
        state.providers = gRes.providers || [];
        const ov = state.scopeOverride;
        const g = state.globalConfig;
        const isGroup = state.scope.scope_type === "group";
        const fields = SCOPE_FIELDS.filter((f) => isGroup || !f.groupOnly);
        const rows = fields
          .map((f, i) => fieldRow(f, ov[f.key], g[f.key] ?? "", true))
          .join("");
        const globalRows = GLOBAL_FIELDS.map((gsec, si) => {
          const gRows = gsec.items.map((f) => fieldRow(f, g[f.key], null, false)).join("");
          return `<div class="form-section-sub"${stagger(si, 0)}>${esc(gsec.section)}</div>${gRows}`;
        }).join("");
        $("content").innerHTML = `
          <div class="form-card"${stagger(0)}>
            <div class="form-title"><i data-lucide="sliders-horizontal"></i>会话覆盖配置</div>
            <p class="form-sub">仅对此会话生效；留空/「跟随全局」表示使用下方全局默认值</p>
            ${rows}
            <div class="form-actions">
              <button class="btn" id="reset-scope-cfg"><i data-lucide="rotate-ccw"></i>恢复继承</button>
              <button class="btn primary" id="save-scope-cfg"><i data-lucide="check"></i>保存覆盖</button>
            </div>
          </div>
          <div class="form-card"${stagger(1)}>
            <div class="form-title"><i data-lucide="globe"></i>全局默认配置</div>
            <p class="form-sub">对所有未单独配置的会话生效</p>
            ${globalRows}
            <div class="form-actions">
              <button class="btn primary" id="save-global-cfg"><i data-lucide="check"></i>保存全局配置</button>
            </div>
          </div>
          <div class="form-card"${stagger(2)}>
            <div class="form-title"><i data-lucide="shield-check"></i>桥接授权记录</div>
            <p class="form-sub">用户通过聊天指令 <code>/memoir consent on</code> 授权后出现在这里</p>
            <div id="consent-box">${skeleton(2)}</div>
          </div>`;
        refreshIcons();
        loadConsents();
        $("save-scope-cfg").addEventListener("click", saveScopeConfig);
        $("reset-scope-cfg").addEventListener("click", resetScopeConfig);
        $("save-global-cfg").addEventListener("click", saveGlobalConfig);
      }

      function collectScopeOverride() {
        const override = {};
        for (const f of SCOPE_FIELDS) {
          const el = document.querySelector(`[data-cfg="${f.key}"]`);
          if (!el) continue;
          if (f.type === "inherit-switch") {
            if (el.value !== "") override[f.key] = el.value === "true";
          } else if (f.type === "inherit-select") {
            if (el.value !== "") override[f.key] = el.value;
          } else if (f.type === "inherit-number") {
            if (el.value !== "") override[f.key] = Number(el.value);
          }
        }
        return override;
      }

      async function saveScopeConfig() {
        const override = collectScopeOverride();
        const res = await safe("保存会话配置", () =>
          bridge.apiPost("scope-config/update", { ...state.scope, override }),
        );
        if (res === null) return;
        state.scopeOverride = override;
        toast(override && Object.keys(override).length ? "会话配置已保存" : "已恢复继承全局");
        renderDetailHead();
      }

      async function resetScopeConfig() {
        const res = await safe("恢复配置", () =>
          bridge.apiPost("scope-config/update", { ...state.scope, override: {} }),
        );
        if (res === null) return;
        state.scopeOverride = {};
        toast("已恢复继承全局配置");
        renderDetailHead();
        loadScopeConfigTab();
      }

      function collectGlobalConfig() {
        const payload = {};
        for (const sec of GLOBAL_FIELDS) {
          for (const f of sec.items) {
            const el = document.querySelector(`[data-cfg="${f.key}"]`);
            if (!el) continue;
            if (f.type === "switch") payload[f.key] = el.checked;
            else if (f.type === "number" || f.type === "float") payload[f.key] = Number(el.value);
            else payload[f.key] = el.value;
          }
        }
        return payload;
      }

      async function saveGlobalConfig() {
        const payload = collectGlobalConfig();
        const res = await safe("保存全局配置", () => bridge.apiPost("config/update", payload));
        if (res === null) return;
        toast(`已保存 ${res.updated?.length ?? 0} 项全局配置`);
      }

      async function clearScope() {
        if (!state.scope) return;

      async function refreshAll(spin = false) {
        $("refresh").classList.toggle("spinning", spin);
        const overview = await safe("刷新概览", () => bridge.apiGet("overview"), { silent: true });
        $("refresh").classList.remove("spinning");
        if (!overview) {
          toast("刷新失败：无法连接记忆服务", "err");
          return false;
        }
        renderOverview(overview.totals);
        state.scopes = overview.scopes || [];
        if (state.scope) {
          const cur = state.scopes.find((s) => s.scope_key === state.scope.scope_key);
          if (!cur) state.scope = state.scopes[0] || null;
        } else {
          state.scope = state.scopes[0] || null;
        }
        renderSidebar();
        await loadTab();
        return true;
      }

      function bindEvents() {
        $("tabs").addEventListener("click", (e) => {
          const tab = e.target.closest(".tab");
          if (!tab) return;
          document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
          state.tab = tab.dataset.tab;
          state.page = 1;
          loadTab();
        });

        $("scope-list").addEventListener("click", (e) => {
          const item = e.target.closest("[data-scope]");
          if (!item) return;
          const [scope_type, scope_key] = item.dataset.scope.split("|");
          state.scope = { scope_type, scope_key };
          state.page = 1;
          renderSidebar();
          loadTab();
        });

        $("scope-filter").addEventListener("input", (e) => {
          state.scopeFilter = e.target.value;
          renderSidebar();
        });

        $("search").addEventListener("input", (e) => {
          clearTimeout(state.searchTimer);
          state.searchTimer = setTimeout(() => {
            state.q = e.target.value.trim();
            state.page = 1;
            if (state.scope && state.tab === "memories") loadMemories();
          }, 300);
        });

        $("prev").addEventListener("click", () => {
          if (state.page > 1) { state.page--; loadTab(); }
        });
        $("next").addEventListener("click", () => {
          state.page++; loadTab();
        });

        $("content").addEventListener("click", async (e) => {
          const retry = e.target.closest("[data-retry]");
          if (retry) {
            const fn = RETRY_LOADERS[retry.dataset.retry];
            if (fn) fn();
            return;
          }
          const tagChip = e.target.closest("[data-tag]");
          if (tagChip && state.tab === "memories") {
            $("search").value = tagChip.dataset.tag;
            state.q = tagChip.dataset.tag;
            state.page = 1;
            loadMemories();
            return;
          }
          const delMemory = e.target.closest("[data-del-memory]");
          const delRaw = e.target.closest("[data-del-raw]");
          if (delMemory && confirm("确定删除这条记忆？")) {
            const ok = await safe("删除记忆", () =>
              bridge.apiPost("memories/delete", { id: Number(delMemory.dataset.delMemory), ...state.scope }),
            );
            if (ok !== null) {
              toast("已删除");
              loadTab();
            }
          } else if (delRaw && confirm("确定删除这轮对话？")) {
            const ok = await safe("删除原文", () =>
              bridge.apiPost("raw/delete", { id: Number(delRaw.dataset.delRaw), ...state.scope }),
            );
            if (ok !== null) {
              toast("已删除");
              loadTab();
            }
          }
        });

        $("content").addEventListener("change", async (e) => {
          const input = e.target.closest("[data-consent]");
          if (!input) return;
          const [platform, sender_id] = input.dataset.consent.split("|");
          const ok = await safe("更新授权", () =>
            bridge.apiPost("consents/toggle", { platform, sender_id, enabled: input.checked }),
          );
          if (ok !== null) toast(input.checked ? "已开启授权" : "已关闭授权");
          else input.checked = !input.checked;
        });

        $("refresh").addEventListener("click", () => refreshAll(true));
      }

      async function main() {
        initParticles();
        const ctx = await bridge.ready();
        if (typeof ctx?.isDark === "boolean") {
          document.documentElement.setAttribute("data-theme", ctx.isDark ? "dark" : "light");
        }
        bridge.onContext((c) => {
          if (typeof c?.isDark === "boolean") {
            document.documentElement.setAttribute("data-theme", c.isDark ? "dark" : "light");
            window.__fxRecolor?.();
          }
        });

        bindEvents();
        await refreshAll();
      }

      RETRY_LOADERS.memories = () => loadMemories();
      RETRY_LOADERS.raw = () => loadRaw();
      RETRY_LOADERS.settings = () => loadScopeConfigTab();
      RETRY_LOADERS.overview = () => refreshAll(true);

      main().catch((err) => {
        const msg = err?.message || String(err);
        $("content").innerHTML = `
          <div class="error-panel">
            <div class="empty-icon"><i data-lucide="unplug"></i></div>
            <h3>无法加载记忆管理页</h3>
            <p class="err-msg">${esc(msg)}</p>
            <button class="btn" onclick="location.reload()"><i data-lucide="rotate-cw"></i>重新加载</button>
          </div>`;
        refreshIcons();
      });
    </script>
  </body>
</html>
