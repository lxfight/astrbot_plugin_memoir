<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记忆管理 - Memoir</title>
    <script>
      // Apply the saved appearance before styles load to avoid a light flash.
      try {
        const saved = localStorage.getItem("memoir.theme");
        document.documentElement.dataset.theme = ["light", "dark"].includes(saved)
          ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./usage.css" />
  </head>
  <body>
    <button id="scope-backdrop" class="scope-backdrop" aria-label="关闭会话列表" hidden></button>
    <header class="mobile-bar"><button class="icon-btn" id="scope-toggle" aria-expanded="false" aria-controls="scope-sidebar" aria-label="切换会话"><i data-lucide="panel-left"></i></button><strong id="mobile-title">记忆管理</strong></header>
    <div class="app">
      <aside class="sidebar" id="scope-sidebar" aria-label="会话导航">
        <div class="brand">
          <img class="brand-logo" src="./logo.png" alt="Memoir 记忆小仓鼠">
          <div>
            <h1>记忆管理</h1>
            <p class="sub">留住值得记得的对话</p>
          </div>
        </div>

        <div class="side-stats" id="cards"></div>

        <div class="side-search">
          <div class="search-wrap">
            <i data-lucide="search"></i>
            <input type="search" id="scope-filter" placeholder="搜索会话" aria-label="搜索会话" />
          </div>
        </div>

        <div class="scope-list" id="scope-list"></div>

        <nav class="global-nav" aria-label="全局管理"><button class="btn" data-view="usage"><i data-lucide="chart-no-axes-combined"></i>用量统计</button><button class="btn" data-view="global"><i data-lucide="globe"></i>全局设置</button><button class="btn" data-view="consents"><i data-lucide="shield-check"></i>桥接授权</button></nav>
        <div class="appearance">
          <div class="appearance-head"><span id="theme-label">外观</span><span id="theme-status" aria-live="polite"></span></div>
          <div class="theme-picker" role="group" aria-labelledby="theme-label">
            <label><input type="radio" name="theme" value="auto" checked /><span><i data-lucide="monitor"></i>跟随</span></label>
            <label><input type="radio" name="theme" value="light" /><span><i data-lucide="sun"></i>浅色</span></label>
            <label><input type="radio" name="theme" value="dark" /><span><i data-lucide="moon"></i>深色</span></label>
          </div>
        </div>
        <div class="side-foot">
          <span class="foot-hint">每个会话可独立调整策略</span>
          <button class="icon-btn" id="refresh" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw"></i></button>
        </div>
      </aside>

      <main class="main">
        <div class="detail-head" id="detail-head"></div>
        <div class="tabs" id="tabs">
          <div class="tab-group">
            <button class="tab active" data-tab="memories" aria-pressed="true"><i data-lucide="brain"></i>记忆</button>
            <button class="tab" data-tab="raw" aria-pressed="false"><i data-lucide="messages-square"></i>原文对话</button>
            <button class="tab" data-tab="processing" aria-pressed="false"><i data-lucide="activity"></i>处理任务</button>
            <button class="tab" data-tab="settings" aria-pressed="false"><i data-lucide="settings-2"></i>会话设置</button>
          </div>
          <div class="spacer"></div>
          <div class="search-wrap tab-search" id="search-wrap">
            <i data-lucide="search"></i>
            <input type="search" id="search" placeholder="搜索当前会话记忆" aria-label="搜索当前会话记忆" />
          </div>
        </div>
        <div class="filter-bar" id="filters"></div>
        <div class="selection-bar" id="selection-bar" hidden></div>
        <div class="content" id="content"></div>
        <div class="pager" id="pager" style="display: none">
          <button class="icon-btn" id="prev" aria-label="上一页"><i data-lucide="chevron-left"></i></button>
          <span id="page-info"></span>
          <button class="icon-btn" id="next" aria-label="下一页"><i data-lucide="chevron-right"></i></button>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <dialog id="confirm-dialog" class="modal"></dialog>
    <dialog id="detail-dialog" class="modal detail-modal"></dialog>
    <dialog id="editor-dialog" class="modal"></dialog>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
