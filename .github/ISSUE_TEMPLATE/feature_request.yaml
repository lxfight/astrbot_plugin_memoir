name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 目前哪个使用场景不方便或缺失
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 希望的功能形态与交互方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
    validations:
      required: false
