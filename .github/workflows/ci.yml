name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff check
        run: uvx ruff@0.15.22 check .
      - name: Ruff format
        run: uvx ruff@0.15.22 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: master
          path: astrbot
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Install AstrBot dependencies
        working-directory: astrbot
        run: uv sync
      - name: Run plugin test suite
        working-directory: astrbot
        run: uv run pytest ../plugin/tests -v
