[project]
name = "astrbot-plugin-memoir"
version = "0.3.0"
description = "模拟人脑记忆闭环的 AstrBot 长期记忆插件"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.19.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "Q",     # flake8-quotes
  "I",     # import-order
  "UP",    # pyupgrade
]
# SQL literals and CJK comments/prompts exceed 88 cols by nature;
# ruff format does not reflow strings, so E501 is noise here
ignore = ["E501"]
